---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "multiqc"
description: Aggregate the QC output of the pipeline into a single report
keywords:
  - qc
  - report
  - summary
tools:
  - "multiqc":
      description: Aggregate results from bioinformatics analyses across many samples into a single report
      homepage: https://multiqc.info
      documentation: https://multiqc.info/docs/
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:multiqc
input:
  - - multiqc_files:
        type: file
        description: Files that MultiQC can parse, collected across the pipeline
  - - multiqc_config:
        type: file
        description: Default MultiQC config file shipped with the pipeline
        pattern: "*.{yml,yaml}"
  - - extra_multiqc_config:
        type: file
        description: Optional user supplied MultiQC config file
        pattern: "*.{yml,yaml}"
  - - multiqc_logo:
        type: file
        description: Optional logo shown in the report header
        pattern: "*.{png,jpg,jpeg,svg}"
output:
  report:
    - "*multiqc_report.html":
        type: file
        description: The MultiQC report
        pattern: "multiqc_report.html"
  data:
    - "*_data":
        type: directory
        description: Parsed statistics behind the report
        pattern: "multiqc_data"
  plots:
    - "*_plots":
        type: directory
        description: Exported plot images
        pattern: "multiqc_plots"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
