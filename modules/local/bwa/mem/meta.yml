---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bwa_mem"
description: Map paired-end short reads to an assembly with bwa-mem2
keywords:
  - align
  - map
  - short reads
  - bam
tools:
  - "bwa-mem2":
      description: Fast suffix-array based read aligner, a rewrite of bwa mem
      homepage: https://github.com/bwa-mem2/bwa-mem2
      documentation: https://github.com/bwa-mem2/bwa-mem2#usage
      licence: ["MIT"]
      identifier: biotools:bwa-mem2
  - "samtools":
      description: Tools for manipulating next-generation sequencing data
      homepage: http://www.htslib.org/
      documentation: https://www.htslib.org/doc/samtools.html
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  - - meta_reads:
        type: map
        description: Meta reads
    - reads:
        type: file
        description: Sequencing reads in FastQ format
  - - meta_ref:
        type: map
        description: Meta ref
    - index:
        type: directory
        description: bwa-mem2 index of the reference assembly, from BWA_INDEX
output:
  bam_pair:
    - - meta_reads:
          type: map
          description: Meta reads
      - "*.bam":
          type: file
          description: Alignments in coordinate-sorted BAM format
          pattern: "*.bam"
      - "*.bam.bai":
          type: file
          description: BAM index
          pattern: "*.bam.bai"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
