# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gunzip"
description: Decompress a gzipped file, for the tools that cannot read gzip
keywords:
  - gunzip
  - decompress
  - gzip
tools:
  - "gzip":
      description: GNU compression utility
      homepage: https://www.gnu.org/software/gzip/
      documentation: https://www.gnu.org/software/gzip/manual/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing group information, e.g. `[ id:'group1' ]`
    - archive:
        type: file
        description: Gzipped file
        pattern: "*.gz"
output:
  file:
    - - meta:
          type: map
          description: Groovy Map containing group information, e.g. `[ id:'group1' ]`
      - "${archive.baseName}":
          type: file
          description: The decompressed file, named after the archive without its `.gz` extension
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
