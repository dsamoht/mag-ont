---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "samtools"
description: Convert, sort and index alignments
keywords:
  - sam
  - bam
  - sort
  - index
tools:
  - "samtools":
      description: Tools for manipulating high-throughput sequencing data
      homepage: https://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: Groovy Map containing sample or group information, e.g. `[ id:'group1' ]`
    - sam:
        type: file
        description: Alignments in SAM format
output:
  bam_pair:
    - - meta:
          type: map
          description: Groovy Map containing sample or group information, e.g. `[ id:'group1' ]`
      - "*.bam":
          type: file
          description: Alignments in sorted BAM format
          pattern: "*.bam"
      - "*.bam.bai":
          type: file
          description: Bam.bai
          pattern: "*.bam.bai"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
