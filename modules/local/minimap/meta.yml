---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "minimap"
description: Map long reads to an assembly with minimap2
keywords:
  - align
  - map
  - long reads
  - nanopore
  - bam
tools:
  - "minimap2":
      description: Versatile pairwise aligner for genomic and spliced nucleotide sequences
      homepage: https://github.com/lh3/minimap2
      documentation: https://lh3.github.io/minimap2/minimap2.html
      licence: ["MIT"]
      identifier: biotools:minimap2
  - "samtools":
      description: Tools for manipulating next-generation sequencing data
      homepage: http://www.htslib.org/
      documentation: https://www.htslib.org/doc/samtools.html
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  - - meta_reads:
        type: map
        description: Meta reads
    - reads:
        type: file
        description: Sequencing reads in FastQ format
  - - meta_reference:
        type: map
        description: Meta reference
    - reference:
        type: file
        description: Reference assembly in FASTA format
output:
  bam_pair:
    - - meta_reads:
          type: map
          description: Meta reads
      - "*.bam":
          type: file
          description: Alignments in coordinate-sorted BAM format
          pattern: "*.bam"
      - "*.bam.bai":
          type: file
          description: BAM index
          pattern: "*.bam.bai"
  aligned_bases:
    - - meta_reads:
          type: map
          description: Meta reads
      - "*.aligned_bases.tsv":
          type: file
          description: "One line, `<sample>\\t<bases>`: bases of the primary and supplementary alignments (samtools stats 'bases mapped (cigar)')"
          pattern: "*.aligned_bases.tsv"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
